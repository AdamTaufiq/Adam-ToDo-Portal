<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Adam Todo Portal" />
    <title>Adam Todo Portal</title>
  </head>
  <body>
    <div id="fallback-login" style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f8fb;font-family:Arial,sans-serif">
      <div style="width:min(410px,100%);padding:38px;background:#fff;border:1px solid #e2e8f0;border-radius:26px;box-shadow:0 22px 55px rgba(30,52,87,.10)">
        <div style="display:grid;place-items:center;width:48px;height:48px;border-radius:14px;color:#fff;font-weight:700;background:#2563eb;margin-bottom:22px">AT</div>
        <p style="color:#2563eb;font-size:12px;font-weight:700;letter-spacing:2px">ADAM TODO PORTAL</p>
        <h1 style="color:#14213d">Welcome back</h1>
        <p style="color:#758198">Sign in to continue to your tasks.</p>
        <label style="display:block;color:#40516d;margin:18px 0 8px">Email</label>
        <input placeholder="you@example.com" disabled style="width:100%;padding:13px;border:1px solid #d9e1ec;border-radius:12px;box-sizing:border-box">
        <label style="display:block;color:#40516d;margin:18px 0 8px">Password</label>
        <input placeholder="Password" disabled style="width:100%;padding:13px;border:1px solid #d9e1ec;border-radius:12px;box-sizing:border-box">
        <button disabled style="width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;color:white;background:#2563eb">Sign in</button>
        <p style="color:#758198;font-size:13px;margin-top:18px">Loading portal configuration...</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
